# Publishes WalletWise to GitHub Pages.
#
# WHY THIS EXISTS
# So the app can be used from a phone or a laptop without installing anything. A
# development server is no use for that: it lives on whichever machine started it and
# dies with it. Pages is a static host, so the link keeps working.
#
# WHAT IS PUBLISHED
# The whole app. There is nothing to configure and no backend to point at — the card
# catalog is bundled and every figure is computed in the browser, so the published build
# is fully functional on its own. A person's name and cards are saved in their own
# browser's storage and never leave it.
name: pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

# Least privilege: read the repo, write a Pages deployment, nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight — a half-finished deployment
# would leave the site broken.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `--offline` skips the Expo CLI's dependency-version check, which needs to reach
      # Expo's servers and has nothing to do with building the bundle.
      - name: Export the web bundle
        env:
          EXPO_OFFLINE: '1'
          EXPO_PUBLIC_ENVIRONMENT: production
        run: npx expo export --platform web --output-dir dist

      # Expo Router turns every .tsx under app/ into a route, test files included, which
      # once shipped 342 KB of assertion library to users.
      - name: Assert no test code is in the bundle
        run: node scripts/check-bundle.mjs dist

      # Expo Router's web output is a single-page app: every route is served by
      # index.html and resolved client-side. Pages returns its own 404 page for an
      # unknown path, so a copy of index.html named 404.html makes a deep link or a
      # refresh work instead of showing GitHub's "file not found".
      - name: Make client-side routing survive a refresh
        run: cp dist/index.html dist/404.html

      # Stops Pages running the output through Jekyll, which strips files and
      # directories beginning with an underscore — and Expo puts everything in `_expo/`.
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      # NOT using `enablement: true`.
      #
      # It looks like it would save a manual step, and it cannot: creating a Pages site
      # needs a permission the workflow token does not have, whatever is written in
      # `permissions:` above. The first attempt failed with "Create Pages site failed.
      # Error: Resource not accessible by integration", and took the whole build down
      # after every earlier step had succeeded.
      #
      # So Pages is enabled once, by hand, in Settings → Pages → Source: GitHub Actions.
      # After that this step just reads the existing configuration.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
