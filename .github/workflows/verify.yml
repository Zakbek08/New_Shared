# Every check that guards a change to WalletWise.
#
# Three jobs, deliberately separate so a failure names its own cause rather than
# "CI is red":
#
#   verify   format, lint, typecheck, unit tests with coverage thresholds
#   bundle   exports the web bundle and proves no test code leaked into it
#   flow     drives the whole four-step flow in a real browser
#
# There is no database job any more, and no Supabase configuration anywhere. The app
# has no backend: the card catalog is bundled and every figure is computed on the
# device, so there is nothing to connect to and nothing to configure.
name: verify

on:
  push:
    branches: ['main', 'claude/**']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: format, lint, typecheck, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests and coverage thresholds
        run: npm run test:coverage -- --ci

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  bundle:
    name: bundle, and prove no test code shipped
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `--offline` skips the Expo CLI's dependency-version check, which needs to reach
      # Expo's servers and is not what this job is testing.
      - name: Export the web bundle
        env:
          EXPO_OFFLINE: '1'
          EXPO_PUBLIC_ENVIRONMENT: development
        run: npx expo export --platform web --output-dir dist

      # Expo Router turns every .tsx under app/ into a route, including test files,
      # which once shipped 342 KB of assertion library to users. metro.config.js blocks
      # them; this asserts the outcome against the built artefact.
      - name: Assert no test code is in the bundle
        run: node scripts/check-bundle.mjs dist

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: dist/
          retention-days: 7

  flow:
    name: walk the whole flow in a browser
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: dist

      # Unpinned on purpose: it must match the Playwright the lockfile installed, and
      # naming a version here is how those two drift apart.
      - name: Install the Chromium build matching the installed Playwright
        run: npx playwright install --with-deps chromium

      # The check no unit test can make: sign in, add cards, ask for a recommendation,
      # then reopen the app and confirm it remembers.
      - name: Sign in, choose cards, get a recommendation, reopen
        run: node scripts/flow-check.mjs dist flow-screenshots

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-screenshots
          path: flow-screenshots/
          if-no-files-found: ignore
          retention-days: 7
